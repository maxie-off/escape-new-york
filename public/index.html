<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#1b1b1f" />
  <title>Sherlock Raccoon & Dr. Slothy</title>
  <link rel="stylesheet" href="style.css" />
  <script>
    // 程式在這台裝置上出錯時，不要只留白畫面：直接把錯誤顯示出來，方便回報
    window.addEventListener('error', function (e) {
      try {
        var t = document.getElementById('title'); if (t) t.hidden = false;
        var box = document.getElementById('boot-error') || document.createElement('div');
        box.id = 'boot-error';
        box.style.cssText = 'position:fixed;left:8px;right:8px;bottom:8px;z-index:9999;background:#fff3a0;color:#1b1b1f;border:3px solid #1b1b1f;border-radius:10px;padding:8px 12px;font:14px/1.4 sans-serif';
        box.textContent = '⚠ 載入出錯 Load error: ' + (e.message || e) + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : '');
        document.body.appendChild(box);
      } catch (x) {}
    });
    // 保險：三秒後如果每一個畫面都還是藏著（例如某個 js 沒載進來），至少把封面叫出來，並提示重新整理
    window.addEventListener('load', function () {
      setTimeout(function () {
        try {
          var ids = ['title', 'setup', 'game', 'ending'], any = false;
          for (var i = 0; i < ids.length; i++) { var el = document.getElementById(ids[i]); if (el && !el.hidden) any = true; }
          if (any) return;
          document.getElementById('title').hidden = false;
          var box = document.getElementById('boot-error');
          if (!box) {
            box = document.createElement('div'); box.id = 'boot-error';
            box.style.cssText = 'position:fixed;left:8px;right:8px;bottom:8px;z-index:9999;background:#fff3a0;color:#1b1b1f;border:3px solid #1b1b1f;border-radius:10px;padding:8px 12px;font:14px/1.4 sans-serif';
            box.textContent = '⚠ 載入好像卡住了，請重新整理一次。If the page looks empty, please reload.';
            document.body.appendChild(box);
          }
        } catch (x) {}
      }, 3000);
    });
</script>
</head>
<body>
  <!-- 封面 -->
  <section id="title" class="screen" hidden>
    <div class="bg" id="title-bg"></div>
    <div class="title-ui">
      <h1 class="logo">Sherlock Raccoon<span class="amp">&amp;</span>Dr. Slothy<small>Escape New York</small></h1>
      <button id="btn-title-start" class="big-btn">Start</button>
      <div class="lang-pick" role="group" aria-label="Language"><button data-lang="zh">繁體中文</button><button data-lang="en">English</button></div>
    </div>
  </section>

  <!-- 選角色 + 房間碼 -->
  <section id="setup" class="screen" hidden>
    <div class="bg" id="setup-bg"></div>
    <div class="setup-grid">
      <div class="panel" id="panel-role">
        <h2 data-zh="選擇角色" data-en="Pick a character">選擇角色</h2>
        <div class="role-row" id="roles"></div>
      </div>
      <div class="panel" id="panel-room">
        <h2 data-zh="房間碼" data-en="Room code">房間碼</h2>
        <button id="btn-gen" class="primary big">Generate</button>
        <div id="room-code" class="code empty" title="點一下複製" data-aria-zh="點一下複製" data-aria-en="Tap to copy">------</div>
        <div class="or" data-zh="或輸入對方給你的房間碼" data-en="or enter the code your friend gives you">或輸入對方給你的房間碼</div>
        <form id="join-form" class="row">
          <input id="code-input" maxlength="6" placeholder="例如 ABC123" data-ph-zh="例如 ABC123" data-ph-en="e.g. ABC123" autocomplete="off" autocapitalize="characters" />
          <button class="primary" data-zh="加入" data-en="Join">加入</button>
        </form>
        <p id="room-status"></p>
      </div>
    </div>
    <button id="btn-start" class="huge" disabled>Start</button>
    <p id="setup-hint" class="setup-hint"></p>
  </section>

  <!-- 結尾 -->
  <section id="ending" hidden></section>

  <!-- 遊戲：整個畫面只有場景本身 -->
  <section id="game" hidden>
    <div id="stage"></div>

    <!-- 文字謎題（場景 2、3 目前的佔位形式） -->
    <div id="legacy" hidden>
      <div class="card">
        <h3><span data-zh="你看到的線索" data-en="Your clues">你看到的線索</span>（<span id="you-role"></span>）</h3>
        <ul id="clues"></ul>
        <form id="answer-form">
          <label id="prompt"></label>
          <div class="row">
            <input id="answer-input" autocomplete="off" />
            <button class="primary" data-zh="提交" data-en="Submit">提交</button>
          </div>
        </form>
      </div>
    </div>

    <div id="hud">
      <button id="btn-docs" aria-label="收藏文件" data-aria-zh="收藏文件" data-aria-en="Documents" hidden>📁<span class="badge"></span></button>
      <button id="btn-hint" aria-label="提示" data-aria-zh="提示" data-aria-en="Hint">💡</button>
      <button id="btn-mute" aria-label="音樂開關" data-aria-zh="音樂開關" data-aria-en="Music on/off">🔊</button>
    </div>
  </section>

  <div id="subtitle" aria-live="polite"></div>
  <div id="modal" hidden></div>
  <div id="docs-layer" hidden></div>
  <div id="toast" aria-live="polite"></div>
  <p id="conn" class="conn"></p>
  <div id="rotate"><div>📱↻<br><span data-zh="請把 iPad 橫放來玩" data-en="Turn your iPad sideways to play">請把 iPad 橫放來玩</span></div></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="i18n.js"></script>
  <script src="art.js"></script>
  <script src="music.js"></script>
  <script src="scene0.js"></script>
  <script src="scene1.js"></script>
  <script src="scene2.js"></script>
<script src="scene3.js"></script>
  <script src="docs.js"></script>
  <script src="title.js"></script>
  <script src="ending.js"></script>
  <script src="app.js"></script>
</body>
</html>
