# CI/CD for the escape-room game.
#
# CI runs on every push and every pull request: install, syntax check, tests.
# CD runs only after that, and only when the push is to main. It asks Render
# to deploy the same service described in render.yaml.
#
# The game needs a WebSocket server (Socket.IO), so this does not use GitHub
# Pages. Pages can only host static files.

name: CI/CD

on:
  push:
  pull_request:

# The workflow can read the repo. It cannot push commits or change settings.
permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # Node 20 satisfies "node": ">=18" in package.json.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `npm ci` installs the exact versions in package-lock.json.
      # It fails if the lockfile is out of date. `npm install` would not.
      - name: Install dependencies
        run: npm ci

      # No ESLint in this repo. This step only checks that the files parse.
      - name: Check JavaScript syntax
        run: npm run lint

      - name: Run tests
        run: npm test

  deploy:
    name: Deploy to Render
    needs: test
    # Push to main only. Pull requests are tested and not deployed.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Ask Render to deploy
        env:
          # Repo secret. Empty until the owner adds it. See the README.
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::notice::RENDER_DEPLOY_HOOK_URL is not set, so this push was tested but not deployed by Actions."
            echo "The README section \"CI/CD\" explains how to add the secret."
            echo "Until then, a Render service that already auto-deploys from GitHub is unchanged."
            exit 0
          fi
          curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL"
          echo "Render accepted the deploy. The site updates in a few minutes."
